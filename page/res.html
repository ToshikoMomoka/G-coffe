    <!-- Res section -->
    <div class="res">
        <h1 class="header">Make a Reservation</h1>
        <form class="form" action="mailto:toshikomomoka@gmail.com" method="post" enctype="text/plain">
            <label class="label" for="name">Your Name</label>
            <input class="input" type="text" id="name" name="name" required>

            <label class="label" for="email">Your Email</label>
            <input class="input" type="email" id="email" name="email" required>

            <label class="label">Select a Table</label>
            <div class="table-grid">
                <div class="table-box" onclick="toggleTableSelection(this)">1</div>
                <div class="table-box" onclick="toggleTableSelection(this)">2</div>
                <div class="table-box" onclick="toggleTableSelection(this)">3</div>
                <div class="table-box" onclick="toggleTableSelection(this)">4</div>
                <div class="table-box" onclick="toggleTableSelection(this)">5</div>
                <div class="table-box" onclick="toggleTableSelection(this)">6</div>
                <div class="table-box" onclick="toggleTableSelection(this)">7</div>
                <div class="table-box" onclick="toggleTableSelection(this)">8</div>
                <div class="table-box" onclick="toggleTableSelection(this)">9</div>
                <div class="table-box" onclick="toggleTableSelection(this)">10</div>
                <div class="table-box" onclick="toggleTableSelection(this)">11</div>
                <div class="table-box" onclick="toggleTableSelection(this)">12</div>
                <div class="table-box" onclick="toggleTableSelection(this)">13</div>
                <div class="table-box" onclick="toggleTableSelection(this)">14</div>
                <div class="table-box" onclick="toggleTableSelection(this)">15</div>
                <div class="table-box" onclick="toggleTableSelection(this)">16</div>
                <div class="table-box" onclick="toggleTableSelection(this)">17</div>
                <div class="table-box" onclick="toggleTableSelection(this)">18</div>
                <div class="table-box" onclick="toggleTableSelection(this)">19</div>
                <div class="table-box" onclick="toggleTableSelection(this)">20</div>
                <div class="table-box" onclick="toggleTableSelection(this)">21</div>
            </div>

            <input class="submit-button" type="submit" value="Send Reservation">
        </form>
        <!-- Modal -->
        <div class="modal fade" id="thankYouModal" tabindex="-1" aria-labelledby="thankYouModalLabel"
            aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="thankYouModalLabel">Thank You</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        Thanks for your reservation!
                    </div>
                    <div class="modal-footer">
