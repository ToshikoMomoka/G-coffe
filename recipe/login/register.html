<style>
    .register-container {
        max-width: 400px;
        margin: 100px auto;
        padding: 30px;
        background-color: #ffffff;
        border-radius: 8px;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
    }

    .register-container h2 {
        text-align: center;
        margin-bottom: 20px;
        font-weight: bold;
        color: #5d4037;
    }

    .form-group label {
        font-weight: bold;
    }

    .form-group input {
        border-radius: 5px;
        padding: 10px;
    }

    .error-message {
        color: red;
        font-size: 0.875rem;
        display: none;
    }

    .btn-primary {
        width: 100%;
        padding: 12px;
        font-size: 1.2rem;
        background-color: #007bff;
        border: none;
        border-radius: 5px;
    }

    .btn-primary:hover {
        background-color: #0056b3;
    }

    .text-center {
        text-align: center;
    }

    .form-control:focus {
        box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
    }
</style>
<div class="register-container">
    <h2>Create an Account</h2>
    <form id="registerForm">
        <div class="form-group mb-3">
            <label for="username">Username</label>
            <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username">
            <small class="error-message" id="usernameError">Username is required</small>
            <small class="error-message" id="usernameExistError">Username already exists</small>
        </div>

        <div class="form-group mb-3">
            <label for="password">Password</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password">
            <small class="error-message" id="passwordError">Password is required</small>
        </div>

        <div class="form-group mb-3">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password">
            <small class="error-message" id="confirmPasswordError">Passwords do not match</small>
        </div>

        <button type="submit" class="btn btn-primary">Register</button>
    </form>

    <p class="text-center mt-3"><a href="login.html">Already have an account? Login</a></p>
</div>
