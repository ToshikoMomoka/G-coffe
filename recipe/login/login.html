    <link href="../../css/login.css" rel="stylesheet">
</head>
<body>
    <div class="navBarLock">
        <nav class="navbar navbar-expand-lg" style="background-color: rgb(235, 206, 167);">
            <div class="container-fluid">
                <a class="navbar-brand" href="../../index.html"><span class="web-name">The </span>CAFERT</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="../../index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="../../page/about.html">About</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="../../page/menu.html">Menu</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="../recipe.html">Blog</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Page+</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="../../index.html#contact">Contact Us</a>
                        </li>
                    </ul>
                    <form class="d-flex" role="search">
                        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                        <button class="btn btn-outline-success" type="submit">Search</button>
                    </form>
                </div>
            </div>
        </nav>
    <!-- Login Form -->
    <div class="login-container">
        <h2>Login to Coffee Connect</h2>
        <form id="loginForm">
            <div class="form-group mb-3">
                <label for="username">Username</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username">
                <small class="error-message" id="usernameError">Username is required</small>
            </div>
            <div class="form-group mb-3">
                <label for="password">Password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password">
                <small class="error-message" id="passwordError">Password is required</small>
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
        <p class="text-center mt-3"><a href="./register.html">Don't have an account? Register</a></p>
    </div>



    <script src="script.js"></script>
</body>
